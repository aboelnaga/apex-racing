  }

  /* ----------------- COLLISION ----------------- */
  _checkCarCollisions() {
    for (let i = 0; i < this.cars.length; i++) {
      for (let j = i + 1; j < this.cars.length; j++) {
        const a = this.cars[i], b = this.cars[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < COLLISION_DIST * COLLISION_DIST && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          // Position separation
          const overlap = COLLISION_DIST - d;
          const push = overlap / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          // Velocity exchange — only if converging
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vN = rvx * nx + rvy * ny;
          if (vN < 0) {
            const j_impulse = -(1 + COLLISION_DAMPING) * vN / 2;
            a.vx -= j_impulse * nx; a.vy -= j_impulse * ny;
            b.vx += j_impulse * nx; b.vy += j_impulse * ny;
            // Accumulate visible damage on heavy contact (scaled by closing speed).
            const impactSpeed = -vN; // positive when converging
            if (impactSpeed > 80) {
              const hit = Math.min(0.18, impactSpeed / 900);
              a.damage = Math.min(0.65, a.damage + hit);
              b.damage = Math.min(0.65, b.damage + hit);
            }
            // Bonk audio if player involved (rate-limited inside Audio.bonk)
            if (a.isPlayer || b.isPlayer) {
              Audio.bonk();
              this.cameras.main.shake(80, 0.005);
              this._spawnImpactFlash((a.x + b.x) / 2, (a.y + b.y) / 2);
            }
          }
        }
      }
    }
  }

  /* ----------------- SKID MARKS ----------------- */
  _maybeSpawnDust(car) {
    // Off-track wheel dust — only for the player and only while moving.
    if (!car.isPlayer) return;
    if (!car.offTrack || car.speed < 60) return;
    const now = this.elapsed;
    if (now - (car._lastDustT || 0) < 0.06) return;
    car._lastDustT = now;
    const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
    const rearX = car.x - cos * 14;
    const rearY = car.y - sin * 14;
    for (const side of [-1, 1]) {
      const wx = rearX + (-sin) * 11 * side;
      const wy = rearY + ( cos) * 11 * side;
      const puff = this.add.image(wx, wy, 'p_dirt')
        .setScale(0.06).setAlpha(0.55).setDepth(1.9);
      this.tweens.add({
        targets: puff,
        alpha: 0,
        scale: 0.18,
        x: wx - cos * 30 + (Math.random() - 0.5) * 16,
        y: wy - sin * 30 + (Math.random() - 0.5) * 16,
        duration: 700, ease: 'Cubic.Out',
        onComplete: () => puff.destroy(),
      });
    }
  }

  _maybeSpawnSkid(car, dt) {
    const vL = Math.abs(car._lastVL || 0);
    const vF = Math.abs(car._lastVF || 0);
    if (vL > 110 && vF > 60 && !car.offTrack) {
      const now = this.elapsed;
      if (now - car.lastSkidT > 0.05) {
        car.lastSkidT = now;
        const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
        const rearX = car.x - cos * 14;
        const rearY = car.y - sin * 14;
        // Kenney skidmark sprite is 60×192 oriented north — rotate by +π/2 too.
        const SKID_ROT = Math.PI / 2;
        for (const side of [-1, 1]) {
          const wx = rearX + (-sin) * 10 * side;
          const wy = rearY + ( cos) * 10 * side;
          const mark = this.add.image(wx, wy, 'skidmark')
            .setRotation(car.heading + SKID_ROT)
            .setScale(0.18, 0.10)
            .setAlpha(0.65)
            .setDepth(2);
          this.skidLayer.add(mark);
          this.tweens.add({ targets: mark, alpha: 0, duration: 2000, onComplete: () => mark.destroy() });
        }
      }
    }
  }

  /* ----------------- RANKING ----------------- */
  _computeRanks() {
    const arr = this.cars.slice().sort((a, b) => {
      // Finishers first by finish time
      if (a.finishedTime !== null && b.finishedTime !== null) return a.finishedTime - b.finishedTime;
      if (a.finishedTime !== null) return -1;
      if (b.finishedTime !== null) return 1;
      // Else by total progress
      return b.totalProgress - a.totalProgress;
    });
    arr.forEach((c, i) => c.rank = i + 1);
    return arr;
  }

  /* ----------------- UPDATE ----------------- */
  update(_, deltaMs) {
    if (this.paused || this.endShown) {
      this._renderCarVisuals();
      this._updateMinimap();
      return;
    }

    let dt = deltaMs / 1000;
    if (dt > 0.05) dt = 0.05; // clamp huge frame jumps

    if (this.state === 'COUNTDOWN') {
      this._updateCountdown(dt);
      // Cars frozen, but render minimap and visuals
      this._renderCarVisuals();
      this._updateMinimap();
      return;
    }

    this.elapsed += dt;

    // Player input
    const pInput = this._readPlayerInput();

    // Physics for each car
    for (const car of this.cars) {
      if (car.finishedTime !== null) {
        // After finish, ease off — light coast and slow steering
        const aiAfter = this._aiInputs(car);
        const cap = MAX_SPEED * 0.4;
        this._physicsStep(car, 0.4, 0, aiAfter.steer, dt, cap);
      } else if (car.isPlayer) {
        // Effective max speed: boost > offtrack > normal
        let cap = MAX_SPEED;
        if (car.offTrack) cap = OFFTRACK_SPEED_CAP;
        if (car.boostTimer > 0) cap = MAX_SPEED * BOOST_SPEED_MULT;
        this._physicsStep(car, pInput.throttle, pInput.brake, pInput.steer, dt, cap);
      } else {
        const ai = this._aiInputs(car);
        let cap = ai.cap;
        if (car.offTrack) cap = OFFTRACK_SPEED_CAP;
        if (car.boostTimer > 0) cap = ai.cap * BOOST_SPEED_MULT;
        this._physicsStep(car, ai.throttle, ai.brake, ai.steer, dt, cap);
      }
    }

    this._checkCarCollisions();

    for (const car of this.cars) {
      this._updateLapAndRank(car, dt);
      this._updatePadInteractions(car, dt);
      this._maybeSpawnSkid(car, dt);
      this._maybeSpawnDust(car);
    }

    // Camera lookahead
    const speed = this.player.speed;
    const lookFactor = Math.min(1, speed / MAX_SPEED) * 80;
    const tx = this.player.x + Math.cos(this.player.heading) * lookFactor;
    const ty = this.player.y + Math.sin(this.player.heading) * lookFactor;
    this.cameras.main.followOffset.x = (this.player.x - tx);
    this.cameras.main.followOffset.y = (this.player.y - ty);

    // Visuals
    this._renderCarVisuals();
    this._updateMinimap();
    this._updateHud();
    this._updateAudio(pInput);

    // Race end check
    if (this.player.finishedTime !== null && !this.endShown) {
      // Wait briefly so the player rolls past the line, then show end
      if (this.elapsed - this.player.finishedTime > 0.4) {
        this._showEnd();
      }
    }
    // Hard cap on race time after player finishes (in case AI never finishes)
    if (this.player.finishedTime !== null && (this.elapsed - this.player.finishedTime) > 60) {
      this._showEnd();
    }
  }

  _renderCarVisuals() {
    for (const car of this.cars) {
      car.sprite.x = car.x; car.sprite.y = car.y;
      car.sprite.rotation = car.heading + (car.spriteRotOffset || 0);
      // Damage tint — multiplies the base car color toward black/sooty.
      // 0 damage → 0xffffff (no change), 0.65 damage → ~0x646464.
      if (car.damage > 0) {
        const v = Math.round(255 * (1 - car.damage * 0.6));
        car.sprite.setTint((v << 16) | (v << 8) | v);
      }
      // Brake glow when braking and moving
      const braking = car.isPlayer && this.cursors && (this.cursors.down.isDown || this.keys.S.isDown);
      if (braking && car.speed > 30 && car.finishedTime === null) {
        const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
        car.brake.x = car.x - cos * 26;
        car.brake.y = car.y - sin * 26;
        car.brake.setVisible(true);
      } else {
        car.brake.setVisible(false);
      }
      // Headlight glow when stationary or low-speed
      if (car.speed < 80) {
        const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
        car.headlight.x = car.x + cos * 30;
        car.headlight.y = car.y + sin * 30;
        car.headlight.setVisible(true);
        car.headlight.setAlpha(0.6 - car.speed / 80 * 0.5);
      } else {
        car.headlight.setVisible(false);
      }
    }
  }

  _updateMinimap() {
    if (!this.miniGfxDynamic) return;
    const { ox, oy, scale } = this.miniProj;
    const g = this.miniGfxDynamic;
    g.clear();

    for (const car of this.cars) {
      const x = ox + car.x * scale, y = oy + car.y * scale;
      if (car.isPlayer) {
        // White outline triangle pointing along the player's heading.
        const cos = Math.cos(car.heading), sin = Math.sin(car.heading);
        const tip   = { x: x + cos * 7,   y: y + sin * 7 };
        const left  = { x: x + (-cos * 4) + (-sin * 4), y: y + (-sin * 4) + ( cos * 4) };
        const right = { x: x + (-cos * 4) + ( sin * 4), y: y + (-sin * 4) + (-cos * 4) };
        g.fillStyle(0xffffff, 1);
        g.fillTriangle(tip.x, tip.y, left.x, left.y, right.x, right.y);
        g.fillStyle(0xff5e3a, 1);
        const tip2   = { x: x + cos * 5.5,   y: y + sin * 5.5 };
        const left2  = { x: x + (-cos * 3) + (-sin * 3), y: y + (-sin * 3) + ( cos * 3) };
        const right2 = { x: x + (-cos * 3) + ( sin * 3), y: y + (-sin * 3) + (-cos * 3) };
        g.fillTriangle(tip2.x, tip2.y, left2.x, left2.y, right2.x, right2.y);
      } else {
        g.fillStyle(car.personality.color, 1);
        g.fillCircle(x, y, 3.5);
      }
    }
  }

  _updateHud() {
    const speedKmh = Math.round(this.player.speed * 0.36);
    this.hudSpeed.setText(`${speedKmh}`);
    this._drawGauge(this.player.speed);
    this.hudLap.setText(`LAP ${Math.max(1, Math.min(this.totalLaps, this.player.lap + 1))}/${this.totalLaps}`);
    const ranks = this._computeRanks();
    this.hudPos.setText(`POS ${this.player.rank}/${this.cars.length}`);
    this.hudTime.setText(`TIME ${formatTime(this.elapsed)}`);
    if (this.player.lapTimes.length > 0) {
      this.hudLastLap.setText(`LAST  ${formatTime(this.player.lapTimes[this.player.lapTimes.length - 1])}`);
    }
    if (this.player.bestLap !== null) {
      this.hudBestLap.setText(`BEST  ${formatTime(this.player.bestLap)}`);
    }
  }

  _updateAudio(pInput) {
    Audio.updateEngine(this.player.speed);
    const skidIntensity = Math.min(0.35, Math.max(0, (Math.abs(this.player._lastVL || 0) - 80) / 200));
    Audio.updateSkid(this.player.offTrack ? 0 : skidIntensity);
    Audio.updateGrass(this.player.offTrack ? 0.18 : 0);

    // Crowd cheering: louder near tribunes, plus a small ambient floor.
    const TRIBUNE_RANGE = 850;
    let nearest = Infinity;
    for (const t of this.trackData.tribunes) {
      const dx = this.player.x - t.x, dy = this.player.y - t.y;
      const d = Math.hypot(dx, dy);
      if (d < nearest) nearest = d;
    }
    const proximity = nearest === Infinity ? 0 : Math.max(0, 1 - nearest / TRIBUNE_RANGE);
    // Floor of 0.08 so there's always a faint background ambience.
    Audio.updateCrowd(0.08 + proximity * 0.92);
  }

  /* ----------------- COUNTDOWN ----------------- */
  _updateCountdown(dt) {
    this.countdownT -= dt;
    const remain = Math.ceil(this.countdownT);
    if (remain <= 0) {
      this.countdownText.setText('GO!');
      this.countdownText.setScale(1);
      if (this.lastBeep !== -1) {
        Audio.go();
        this.lastBeep = -1;
      }
      if (this.countdownT < -0.6) {
        this.countdownText.setVisible(false);
        this.state = 'RACING';
        for (const car of this.cars) car.lapStartTime = 0;
        this.elapsed = 0;
      }
    } else {
      this.countdownText.setText(`${remain}`);
      // Beep on transitions
      if (remain !== this.lastBeep) {
        this.lastBeep = remain;
        Audio.beep();
        // Bounce animation
        this.tweens.killTweensOf(this.countdownText);
        this.countdownText.setScale(1.4).setAlpha(1);
        this.tweens.add({ targets: this.countdownText, scale: 1, alpha: 0.95, duration: 700, ease: 'Cubic.Out' });
      }
    }
  }

  /* ----------------- PAUSE / RESTART / MENU ----------------- */
  _togglePause() {
    if (this.endShown) return;
    this.paused = !this.paused;
    if (this.paused) {
      Audio.silenceEngine();
      Audio.silenceLoops();
      if (!this.pauseOverlay) {
        const W = this.scale.width, H = this.scale.height;
        const c = this.add.container(0, 0).setScrollFactor(0).setDepth(200);
        const dim = this.add.graphics();
        dim.fillStyle(0x000000, 0.55); dim.fillRect(0, 0, W, H);
        const txt = this.add.text(W / 2, H / 2, 'PAUSED', {
          fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
          fontSize: '80px', fontStyle: '900', color: '#fff',
        }).setOrigin(0.5);
        const sub = this.add.text(W / 2, H / 2 + 60, 'P to resume   ·   Esc menu   ·   R new track   ·   Space restart', {
          fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
          fontSize: '16px', color: '#9aa6b8',
        }).setOrigin(0.5);
        c.add([dim, txt, sub]);
        this.pauseOverlay = c;
      }
      this.pauseOverlay.setVisible(true);
    } else {
      Audio.updateEngine(this.player.speed);
      if (this.pauseOverlay) this.pauseOverlay.setVisible(false);
    }
  }

  _restart(sameTrack) {
    Audio.silenceEngine();
    Audio.silenceLoops();
    if (sameTrack) {
      this.scene.restart({
        difficulty: this.difficulty,
        keepTrack: true,
        preservedTrackData: this.trackData,
        preservedTheme: this.theme,
      });
    } else {
      this.scene.restart({ difficulty: this.difficulty });
    }
  }

  _toMenu() {
    Audio.silenceEngine();
    Audio.silenceLoops();
    this.scene.start('Menu', { difficulty: this.difficulty });
  }

  // Debug — force the end screen to verify it renders.
  // win=true → player crosses the line first.
  // win=false → all AIs finish a tick earlier so player is ranked last.
  _debugForceEnd(win) {
    if (this.state !== 'RACING' || this.endShown) return;
    if (!win) {
      for (const car of this.cars) {
        if (!car.isPlayer && car.finishedTime === null) {
          car.lap = this.totalLaps;
          car.finishedTime = this.elapsed - 0.5;
        }
      }
    }
    this.player.lap = this.totalLaps;
    this.player.finishedTime = this.elapsed;
  }

  /* ----------------- END SCREEN ----------------- */
  _showEnd() {
    if (this.endShown) return;
    this.endShown = true;
    Audio.silenceEngine();
    Audio.silenceLoops();

    const ranks = this._computeRanks();
    const playerRank = this.player.rank;
    const won = playerRank === 1;

    if (won) Audio.winFanfare(); else Audio.loseHorn();

    // Freeze the camera and anchor the overlay at its current scroll origin.
    // Children sit at "screen" coordinates inside the overlay; their world
    // bounds = camera scroll + local. Pointer events convert screen → world
    // by adding camera scroll, so input lines up with rendering for free —
    // no scrollFactor mismatch regardless of how far we've driven.
    this.cameras.main.stopFollow();
    const cs = { x: this.cameras.main.scrollX, y: this.cameras.main.scrollY };

    const W = this.scale.width, H = this.scale.height;
    const overlay = this.add.container(cs.x, cs.y).setDepth(220);

    const dim = this.add.graphics();
    dim.fillStyle(0x000000, 0.6); dim.fillRect(0, 0, W, H);
    overlay.add(dim);

    // Panel
    const pw = 540, ph = 500;
    const panel = this.add.graphics();
    panel.fillStyle(0x131826, 1);
    panel.fillRoundedRect(W / 2 - pw / 2, H / 2 - ph / 2, pw, ph, 18);
    panel.lineStyle(2, 0x2a3144, 1);
    panel.strokeRoundedRect(W / 2 - pw / 2, H / 2 - ph / 2, pw, ph, 18);
    overlay.add(panel);

    const heading = this.add.text(W / 2, H / 2 - ph / 2 + 50, won ? 'YOU WIN!' : 'YOU LOSE', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '72px', fontStyle: '900',
      color: won ? '#ffd34a' : '#e06060',
    }).setOrigin(0.5).setScale(0);
    heading.setShadow(0, 5, won ? '#ff8a3a' : '#7a1f1f', 18, false, true);
    overlay.add(heading);
    this.tweens.add({ targets: heading, scale: 1, ease: 'Back.Out', duration: 600 });

    if (!won) this.cameras.main.shake(400, 0.012);

    if (won) {
      // Confetti
      const colors = [0xffd34a, 0xff5e3a, 0x3a86ff, 0x2ecc71, 0x9b59b6, 0xff8a3a, 0xffffff];
      const confetti = this.add.particles(W / 2, -20, 'confetti', {
        x: { min: 0, max: W }, y: -20,
        lifespan: 4500,
        speedY: { min: 80, max: 220 },
        speedX: { min: -60, max: 60 },
        gravityY: 100,
        rotate: { start: 0, end: 360 },
        scale: { min: 0.7, max: 1.4 },
        tint: colors,
        frequency: 30,
        quantity: 4,
      }).setScrollFactor(0).setDepth(225);
      this.endParticles = confetti;
    }

    // Stats panel
    const ts = (sz, c, b) => ({
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: sz, color: c, fontStyle: b ? 'bold' : 'normal',
    });

    const startY = H / 2 - 70;
    const left = W / 2 - 200;
    const stats = this.add.container(0, 0);
    overlay.add(stats);

    stats.add(this.add.text(left, startY,        `POSITION`, ts('14px', '#7d8aa0', true)));
    stats.add(this.add.text(left + 110, startY,  `${ordinal(playerRank)} of ${this.cars.length}`, ts('14px', '#fff', true)));

    stats.add(this.add.text(left, startY + 24,   `TOTAL TIME`, ts('14px', '#7d8aa0', true)));
    stats.add(this.add.text(left + 110, startY + 24, `${formatTime(this.player.finishedTime ?? this.elapsed)}`, ts('14px', '#fff', true)));

    stats.add(this.add.text(left, startY + 48,   `BEST LAP`, ts('14px', '#7d8aa0', true)));
    stats.add(this.add.text(left + 110, startY + 48, `${this.player.bestLap !== null ? formatTime(this.player.bestLap) : '--'}`, ts('14px', '#ffd34a', true)));

    stats.add(this.add.text(left, startY + 72,   `DIFFICULTY`, ts('14px', '#7d8aa0', true)));
    stats.add(this.add.text(left + 110, startY + 72, DIFFICULTY[this.difficulty].label, ts('14px', '#ff9072', true)));

    // Full ranking list
    stats.add(this.add.text(W / 2, startY + 110, 'FINAL RANKING', ts('13px', '#7d8aa0', true)).setOrigin(0.5));
    ranks.forEach((c, i) => {
      const y = startY + 138 + i * 24;
      const colorHex = c.isPlayer ? '#ffffff' : ('#' + c.personality.color.toString(16).padStart(6, '0'));
      stats.add(this.add.text(W / 2 - 180, y, `${i + 1}.`, ts('15px', colorHex, true)));
      stats.add(this.add.text(W / 2 - 150, y, c.label, ts('15px', colorHex, c.isPlayer)));
      const tt = c.finishedTime !== null ? formatTime(c.finishedTime) : '—';
      stats.add(this.add.text(W / 2 + 180, y, tt, ts('15px', colorHex, false)).setOrigin(1, 0));
    });

    // Buttons
    const by = H / 2 + ph / 2 - 50;
    overlay.add(makeButton(this, W / 2 - 170, by, 150, 50, 'RACE AGAIN', {
      fontSize: 16, onClick: () => this._restart(true),
    }));
    overlay.add(makeButton(this, W / 2, by, 150, 50, 'NEW TRACK', {
      bg: 0x3a86ff, bgHover: 0x5b9cff, bgActive: 0x2670e0,
      fontSize: 16, onClick: () => this._restart(false),
    }));
    overlay.add(makeButton(this, W / 2 + 170, by, 150, 50, 'MENU', {
      bg: 0x4a566a, bgHover: 0x5e6c83, bgActive: 0x3a4453,
      fontSize: 16, onClick: () => this._toMenu(),
    }));

    this.endOverlay = overlay;
  }
}

/* =====================================================================
   UTILITY — formatting
   ===================================================================== */
function formatTime(seconds) {
  if (seconds === null || seconds === undefined) return '--';
  const m = Math.floor(seconds / 60);
  const s = seconds - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, '0')}`;
}
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* =====================================================================
   BOOT
   ===================================================================== */
const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#07080c',
  pixelArt: false,
  roundPixels: false,
  scale: {
    mode: Phaser.Scale.RESIZE,
  },
  scene: [BootScene, MenuScene, RaceScene],
};
const game = new Phaser.Game(config);
if (DEBUG) window.__game = game;

// Keep the canvas matching the window
window.addEventListener('resize', () => game.scale.resize(window.innerWidth, window.innerHeight));

// First user gesture unlocks audio
const unlock = () => { Audio.init(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
window.addEventListener('pointerdown', unlock);
window.addEventListener('keydown', unlock);
</script>
