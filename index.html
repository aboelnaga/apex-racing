/* =====================================================================
   APEX — Top-down 2D racing
   Phaser 3.80 (CDN), Kenney Racing Pack PNGs in ./assets/.

   When true: exposes `window.__game` and binds G (force-win) /

   without racing to completion. Leave off in shipped builds. */
const DEBUG = false;

/* ---------- World + physics constants (each tunable) ---------- */
const WORLD_W = 2800;        // world width in px
const WORLD_H = 2000;        // world height in px
const ROAD_HALF = 110;       // road half-width — outer/inner edges sit ±110 from centerline
const MAX_SPEED = 480;       // top forward speed (px/s)
const MAX_REVERSE = 180;     // top reverse speed (px/s)
const ACCEL = 380;           // forward acceleration when throttling (px/s²)
const BRAKE = 540;           // brake deceleration (px/s²)
const STEER_RATE = 2.8;      // base steering rate (rad/s) — scaled by speed ratio so no rotate-in-place
const FORWARD_FRICTION_K = 0.55; // forward velocity decay rate per second (used as exp(-k*dt))
const GRIP_LOW_SPEED = 8.5;  // lateral grip at near-zero speed (high = no slide)
const GRIP_HIGH_SPEED = 2.2; // lateral grip at top speed (low = arcade slide)
const CAR_RADIUS = 20;       // collision circle radius in px
const COLLISION_DIST = CAR_RADIUS * 2; // 40 — car-to-car contact threshold
const COLLISION_DAMPING = 0.65;        // velocity transfer damping along separation axis
const OFFTRACK_SPEED_CAP = 180;        // top speed when off-track
const OFFTRACK_LATERAL_LIMIT = ROAD_HALF * 0.95; // when lateral offset exceeds this, off-track
const BOOST_LEN = 70;        // boost pad length along road (px)
const BOOST_SPEED_MULT = 1.32;
const BOOST_KICK = 220;      // immediate forward acceleration kick on pickup (added to velocity)
const BOOST_DURATION = 1.8;  // seconds
const OIL_LEN = 90;          // oil spot length along road (px)
const OIL_GRIP_MULT = 0.18;  // lateral grip multiplier when on oil
const OIL_DURATION = 0.7;    // sec (lingers a moment after leaving)

/* =====================================================================
   AUDIO ENGINE — Web Audio synthesized SFX
   ===================================================================== */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.engineNodes = null;
    this.skidNodes = null;
    this.grassNodes = null;
    this._lastBonk = 0;
  }
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.55;
    this.master.connect(this.ctx.destination);
  }
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
    return this.muted;
  }
  suspend() { if (this.ctx) this.ctx.suspend(); }
  resume()  { if (this.ctx) this.ctx.resume(); }

  /* --- Continuous engine: sub triangle + sawtooth one octave up, lowpass --- */
  startEngine() {
    if (!this.ctx || this.engineNodes) return;
    const ctx = this.ctx;
    const sub = ctx.createOscillator(); sub.type = 'triangle'; sub.frequency.value = 60;
    const top = ctx.createOscillator(); top.type = 'sawtooth'; top.frequency.value = 120;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 350; filter.Q.value = 1.4;
    const subG = ctx.createGain(); subG.gain.value = 0.55;
    const topG = ctx.createGain(); topG.gain.value = 0.18;
    const out = ctx.createGain(); out.gain.value = 0.0;
    sub.connect(subG).connect(filter);
    top.connect(topG).connect(filter);
    filter.connect(out).connect(this.master);
    sub.start(); top.start();
    this.engineNodes = { sub, top, filter, out };
  }
  updateEngine(speed) {
    if (!this.engineNodes) return;
    const r = Math.max(0, Math.min(1, speed / MAX_SPEED));
    const subF = 60 + r * 90;
    const topF = subF * 2;
    const cutoff = 350 + r * 350;
    const gain = 0.16 + r * 0.22;
    const t = this.ctx.currentTime;
    this.engineNodes.sub.frequency.linearRampToValueAtTime(subF, t + 0.05);
    this.engineNodes.top.frequency.linearRampToValueAtTime(topF, t + 0.05);
    this.engineNodes.filter.frequency.linearRampToValueAtTime(cutoff, t + 0.05);
    this.engineNodes.out.gain.linearRampToValueAtTime(gain, t + 0.05);
  }
  silenceEngine() {
    if (!this.engineNodes) return;
    const t = this.ctx.currentTime;
    this.engineNodes.out.gain.cancelScheduledValues(t);
    this.engineNodes.out.gain.linearRampToValueAtTime(0, t + 0.05);
  }

  /* --- Skid loop: filtered noise --- */
  _makeNoiseSource(filterType, freq) {
    const ctx = this.ctx;
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(f).connect(g).connect(this.master);
    src.start();
    return { src, g, f };
  }
  startSkid()  { if (this.ctx && !this.skidNodes)  this.skidNodes  = this._makeNoiseSource('highpass', 1500); }
  startGrass() { if (this.ctx && !this.grassNodes) this.grassNodes = this._makeNoiseSource('lowpass',  600); }
  updateSkid(intensity)  { if (this.skidNodes)  this._setNoise(this.skidNodes,  Math.min(0.35, intensity)); }
  updateGrass(intensity) { if (this.grassNodes) this._setNoise(this.grassNodes, Math.min(0.30, intensity)); }
  _setNoise(n, target) {
    const t = this.ctx.currentTime;
    n.g.gain.cancelScheduledValues(t);
    n.g.gain.linearRampToValueAtTime(target, t + 0.05);
  }
  silenceLoops() {
    if (this.skidNodes)  this._setNoise(this.skidNodes,  0);
    if (this.grassNodes) this._setNoise(this.grassNodes, 0);
    if (this.crowdNodes) this._setNoise({ g: this.crowdNodes.outGain }, 0);
  }

  // Crowd: bandpassed noise (voice band) modulated by a slow sine LFO
  // for a "shhhh-WAVE-shhhh" swell. Outer code drives outGain by proximity.
  startCrowd() {
    if (!this.ctx || this.crowdNodes) return;
    const ctx = this.ctx;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;

    // LFO (~0.4 Hz) sweeps an inner gain to create swell
    const lfo = ctx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 0.4;
    const lfoDepth = ctx.createGain(); lfoDepth.gain.value = 0.4;

    const swellGain = ctx.createGain(); swellGain.gain.value = 0.6;
    const outGain   = ctx.createGain(); outGain.gain.value = 0;

    src.connect(bp).connect(swellGain).connect(outGain).connect(this.master);
    lfo.connect(lfoDepth); lfoDepth.connect(swellGain.gain);

    src.start(); lfo.start();
    this.crowdNodes = { src, lfo, swellGain, outGain };
  }
  updateCrowd(intensity) {
    if (!this.crowdNodes) return;
    const t = this.ctx.currentTime;
    this.crowdNodes.outGain.gain.cancelScheduledValues(t);
    this.crowdNodes.outGain.gain.linearRampToValueAtTime(
      Math.max(0, Math.min(0.14, intensity * 0.14)),
      t + 0.15
    );
  }
  // Brief celebratory roar — fires on lap completion.
  crowdSurge() {
    if (!this.crowdNodes) return;
    const t = this.ctx.currentTime;
    this.crowdNodes.outGain.gain.cancelScheduledValues(t);
    this.crowdNodes.outGain.gain.setValueAtTime(this.crowdNodes.outGain.gain.value, t);
    this.crowdNodes.outGain.gain.linearRampToValueAtTime(0.20, t + 0.08);
    this.crowdNodes.outGain.gain.linearRampToValueAtTime(0.04, t + 1.2);
  }

  /* --- One-shot tones --- */
  _tone(type, freq, dur, gainPeak = 0.22, sweepTo = null, sweepShape = 'exp') {
    if (!this.ctx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (sweepTo != null) {
      if (sweepShape === 'exp') o.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
      else o.frequency.linearRampToValueAtTime(sweepTo, t + dur);
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gainPeak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  beep()       { this._tone('square',  660, 0.20, 0.22); }
  go()         { this._tone('square',  990, 0.45, 0.28); }
  boost()      { this._tone('sawtooth', 220, 0.28, 0.25, 900, 'exp'); }
  bonk()       {
    const now = performance.now();
    if (now - this._lastBonk < 60) return;
    this._lastBonk = now;
    this._tone('sine', 180, 0.22, 0.32, 70, 'exp');
  }
  lapDing()    { this._tone('triangle', 880, 0.20, 0.25); setTimeout(() => this._tone('triangle', 1175, 0.25, 0.25), 110); }
  winFanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this._tone('triangle', f, 0.32, 0.25), i * 150)); }
  loseHorn()   { [392, 349, 311, 247].forEach((f, i) => setTimeout(() => this._tone('sawtooth', f, 0.40, 0.20), i * 180)); }
}
const Audio = new AudioEngine();

/* =====================================================================
   GEOMETRY HELPERS — convex hull, push-apart, Catmull-Rom, geometry
   ===================================================================== */
function cross(O, A, B) { return (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x); }

function convexHull(pts) {
  const sorted = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

// Iteratively push neighboring points apart until each pair >= minDist.
function pushApart(pts, minDist, maxIter = 80) {
  const md2 = minDist * minDist;
  for (let iter = 0; iter < maxIter; iter++) {
    let moved = false;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < md2 && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (minDist - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Keep within world bounds with a margin
  for (const p of pts) {
    p.x = Math.max(180, Math.min(WORLD_W - 180, p.x));
    p.y = Math.max(180, Math.min(WORLD_H - 180, p.y));
  }
}

// Catmull-Rom through closed control polygon. samplesPerSegment controls smoothness.
function catmullRomClosed(pts, samplesPerSegment) {
  const out = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    for (let j = 0; j < samplesPerSegment; j++) {
      const t = j / samplesPerSegment;
      const t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1.x) +
        (-p0.x + p2.x) * t +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
      const y = 0.5 * ((2 * p1.y) +
        (-p0.y + p2.y) * t +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
      out.push({ x, y });
    }
  }
  return out;
}

// Compute tangent (unit), left-hand normal, signed curvature, arc length.
function computeGeometry(samples) {
  const n = samples.length;
  let total = 0;
  for (let i = 0; i < n; i++) {
    const a = samples[i];
    const b = samples[(i + 1) % n];
    const tx = b.x - a.x, ty = b.y - a.y;
    const tlen = Math.hypot(tx, ty) || 1;
    a.tx = tx / tlen; a.ty = ty / tlen;
    a.nx = -a.ty;     a.ny = a.tx;
    a.segLen = tlen;
    a.s = total;
    total += tlen;
  }
  // Curvature via difference of consecutive tangents (signed)
  for (let i = 0; i < n; i++) {
    const a = samples[i];
    const b = samples[(i + 1) % n];
    a.curv = (b.tx * a.ty - b.ty * a.tx) / Math.max(a.segLen, 1);
  }
  samples.totalLen = total;
}

/* =====================================================================
   TRACK GENERATION — full pipeline per the spec
   ===================================================================== */
function generateTrack() {
  // 1. ~18 random points with margin
  const pts = [];
  for (let i = 0; i < 18; i++) {
    pts.push({
      x: 240 + Math.random() * (WORLD_W - 480),
      y: 240 + Math.random() * (WORLD_H - 480),
    });
  }
  // 2. Convex hull
  let hull = convexHull(pts);
  if (hull.length < 6) return generateTrack(); // very rare degenerate, regenerate
  // 3. Push apart so neighbors >= 380
  pushApart(hull, 380);
  // 4. Radial perturbation in [-130, +50] — breaks the convex pattern
  let cx = 0, cy = 0;
  for (const p of hull) { cx += p.x; cy += p.y; }
  cx /= hull.length; cy /= hull.length;
  for (const p of hull) {
    const dx = p.x - cx, dy = p.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    const off = -130 + Math.random() * 180; // [-130, +50]
    p.x += (dx / len) * off;
    p.y += (dy / len) * off;
    p.x = Math.max(180, Math.min(WORLD_W - 180, p.x));
    p.y = Math.max(180, Math.min(WORLD_H - 180, p.y));
  }
  // 5. Smooth into closed polyline
  const samples = catmullRomClosed(hull, 28);
  // 6. Geometry
  computeGeometry(samples);
  // Sanity check: if track has any extreme self-cluster, retry
  if (samples.totalLen < 2200) return generateTrack();
  return { samples, hull };
}

// Place pads on segments matching a curvature predicate, well-spaced along arc length.
function placePads(samples, count, padLen, prefer) {
  const candidates = samples.map((p, i) => ({ p, i, c: Math.abs(p.curv || 0) }));
  candidates.sort((a, b) => prefer === 'low' ? a.c - b.c : b.c - a.c);
  const minSep = (samples.totalLen / Math.max(count, 1)) * 0.45;
  const chosen = [];
  for (const cand of candidates) {
    if (chosen.every(c => Math.abs(((cand.p.s - c.p.s + samples.totalLen) % samples.totalLen)) > minSep
      && Math.abs(((c.p.s - cand.p.s + samples.totalLen) % samples.totalLen)) > minSep)) {
      chosen.push({ p: cand.p, idx: cand.i, len: padLen });
      if (chosen.length >= count) break;
    }
  }
  return chosen;
}

// Pick `count` low-curvature samples that are far apart along arc length,
// avoiding any positions in `avoidPads` (other extras like boost/oil).
function pickStraights(samples, count, avoidPads = [], minPadGap = 220) {
  const candidates = samples.map((p, i) => ({ p, i, c: Math.abs(p.curv || 0) }))
    .filter(c => c.c < 0.0025);
  candidates.sort((a, b) => a.c - b.c);
  const minSep = (samples.totalLen / Math.max(count, 1)) * 0.55;
  const total = samples.totalLen;
  const wrapDist = (a, b) => {
    const d = Math.abs(a - b);
    return Math.min(d, total - d);
  };
  const chosen = [];
  for (const cand of candidates) {
    if (chosen.some(c => wrapDist(cand.p.s, c.p.s) < minSep)) continue;
    if (avoidPads.some(p => wrapDist(cand.p.s, p.p.s) < minPadGap)) continue;
    chosen.push({ p: cand.p, idx: cand.i });
    if (chosen.length >= count) break;
  }
  return chosen;
}

// Walk the centerline placing a cone every `spacing` units along the inside
// edge wherever curvature is above `curvThreshold` (i.e. tight corners).
function placeCones(samples, spacing = 70, curvThreshold = 0.0045) {
  const total = samples.totalLen;
  const result = [];
  let lastS = -Infinity;
  for (let i = 0; i < samples.length; i++) {
    const p = samples[i];
    if (Math.abs(p.curv || 0) < curvThreshold) continue;
    const ds = p.s - lastS;
    if (ds < spacing && ds > -total * 0.5) continue;
    const side = (p.curv || 0) > 0 ? 1 : -1; // inside of corner
    result.push({ p, idx: i, side });
    lastS = p.s;
  }
  return result;
}

// Pick `count` peak-curvature points (corner apexes) far apart along arc length.
function pickApexes(samples, count) {
  const candidates = samples.map((p, i) => ({ p, i, c: Math.abs(p.curv || 0) }))
    .filter(c => c.c > 0.005);
  candidates.sort((a, b) => b.c - a.c);
  const minSep = (samples.totalLen / Math.max(count, 1)) * 0.5;
  const total = samples.totalLen;
  const wrapDist = (a, b) => {
    const d = Math.abs(a - b);
    return Math.min(d, total - d);
  };
  const chosen = [];
  for (const cand of candidates) {
    if (chosen.some(c => wrapDist(cand.p.s, c.p.s) < minSep)) continue;
    chosen.push({ p: cand.p, idx: cand.i });
    if (chosen.length >= count) break;
  }
  return chosen;
}

// Scatter ~count decorations in surrounding terrain, ≥35px outside the road.
// Each deco picks a random sprite key from `keys` so themes can mix variants.
function placeDecorations(samples, count, keys, scaleMin = 0.7, scaleMax = 1.3) {
  const decos = [];
  const reqDist2 = (ROAD_HALF + 35) * (ROAD_HALF + 35);
  let attempts = 0;
  const cell = 200;
  const cols = Math.ceil(WORLD_W / cell);
  const rows = Math.ceil(WORLD_H / cell);
  const buckets = new Array(cols * rows).fill(null).map(() => []);
  for (const s of samples) {
    const cx = Math.min(cols - 1, Math.max(0, Math.floor(s.x / cell)));
    const cy = Math.min(rows - 1, Math.max(0, Math.floor(s.y / cell)));
    buckets[cy * cols + cx].push(s);
  }
  while (decos.length < count && attempts < count * 20) {
    attempts++;
    const x = 60 + Math.random() * (WORLD_W - 120);
    const y = 60 + Math.random() * (WORLD_H - 120);
    const cxN = Math.floor(x / cell), cyN = Math.floor(y / cell);
    let minD2 = Infinity;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const ix = cxN + dx, iy = cyN + dy;
      if (ix < 0 || iy < 0 || ix >= cols || iy >= rows) continue;
      const bucket = buckets[iy * cols + ix];
      for (const s of bucket) {
        const ddx = s.x - x, ddy = s.y - y;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 < minD2) minD2 = d2;
      }
    }
    if (minD2 > reqDist2) {
      decos.push({
        x, y,
        key: keys[Math.floor(Math.random() * keys.length)],
        scale: scaleMin + Math.random() * (scaleMax - scaleMin),
        rot: Math.random() * Math.PI * 2,
      });
    }
  }
  return decos;
}

/* =====================================================================
   PROCEDURAL TEXTURES — generated once at boot, used everywhere
   ===================================================================== */
function lighten(c, amt) {
  const r = Math.min(255, Math.round(((c >> 16) & 0xff) + 255 * amt));
  const g = Math.min(255, Math.round(((c >> 8)  & 0xff) + 255 * amt));
  const b = Math.min(255, Math.round(( c        & 0xff) + 255 * amt));
  return (r << 16) | (g << 8) | b;
}

function makeBrakeGlowTexture(scene) {
  const w = 18, h = 18;
  const g = scene.make.graphics({ add: false });
  for (let r = 9; r >= 1; r--) {
    g.fillStyle(0xff2a2a, 0.06);
    g.fillCircle(w / 2, h / 2, r);
  }
  g.fillStyle(0xff5252, 0.7);
  g.fillCircle(w / 2, h / 2, 3);
  g.generateTexture('brakeGlow', w, h);
  g.destroy();
}

function makeHeadlightGlowTexture(scene) {
  const w = 22, h = 22;
  const g = scene.make.graphics({ add: false });
  for (let r = 11; r >= 1; r--) {
    g.fillStyle(0xfff5a8, 0.05);
    g.fillCircle(w / 2, h / 2, r);
  }
  g.fillStyle(0xfff8c2, 0.6);
  g.fillCircle(w / 2, h / 2, 4);
  g.generateTexture('headGlow', w, h);

}

function makePalmTexture(scene) {
  const w = 64, h = 64;
  const g = scene.make.graphics({ add: false });
  // Shadow
  g.fillStyle(0x000000, 0.32);
  g.fillCircle(w / 2 + 4, h / 2 + 5, 24);
  // Trunk hub
  g.fillStyle(0x4f3617);
  g.fillCircle(w / 2, h / 2, 5);
  g.fillStyle(0x6b4d22);
  g.fillCircle(w / 2 - 1, h / 2 - 1, 2.5);
  // Fronds — radiating ellipses
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + Math.random() * 0.1;
    g.save();
    g.translateCanvas(w / 2 + Math.cos(a) * 14, h / 2 + Math.sin(a) * 14);
    g.rotateCanvas(a);
    g.fillStyle(0x1f5926);    g.fillEllipse(0, 0, 24, 9);
    g.fillStyle(0x35803d);    g.fillEllipse(-2, 0, 20, 6);
    g.fillStyle(0x59a85f, 0.7); g.fillEllipse(-4, 0, 14, 3);
    g.restore();
  }
  g.generateTexture('palm', w, h);
  g.destroy();
}

/* =====================================================================
   UI HELPERS — buttons, pills, panels with consistent styling
   ===================================================================== */
function makeButton(scene, x, y, w, h, label, opts = {}) {
  const {
    bg = 0xff5e3a,
    bgHover = 0xff7a5a,
    bgActive = 0xe04f30,
    fg = 0xffffff,
    fontSize = 26,
    radius = 12,
    onClick = () => {},
  } = opts;

  const c = scene.add.container(x, y);
  const gfx = scene.add.graphics();
  const drawBg = (color) => {
    gfx.clear();
    gfx.fillStyle(0x000000, 0.35); gfx.fillRoundedRect(-w / 2 + 2, -h / 2 + 4, w, h, radius);
    gfx.fillStyle(color, 1);       gfx.fillRoundedRect(-w / 2,     -h / 2,     w, h, radius);
    gfx.lineStyle(2, lighten(color, 0.25), 0.9); gfx.strokeRoundedRect(-w / 2, -h / 2, w, h, radius);
  };
  drawBg(bg);

  // Real Rectangle game object handles hit detection (well-tested bounds + origin).
  const hit = scene.add.rectangle(0, 0, w, h, 0xffffff, 0)
    .setInteractive({ useHandCursor: true });

  const txt = scene.add.text(0, 0, label, {
    fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
    fontSize: `${fontSize}px`, fontStyle: 'bold',
    color: '#' + fg.toString(16).padStart(6, '0'),
  }).setOrigin(0.5);

  c.add([gfx, hit, txt]);

  hit.on('pointerover', () => drawBg(bgHover));
  hit.on('pointerout',  () => drawBg(bg));
  hit.on('pointerdown', () => drawBg(bgActive));
  hit.on('pointerup',   () => { drawBg(bgHover); onClick(); });

  c.label = txt;
  c.setBg = drawBg;
  return c;
}

function makePill(scene, x, y, label, opts = {}) {
  const {
    selected = false,
    selectedColor = 0xff5e3a,
    onClick = () => {},
  } = opts;
  const w = 110, h = 38, radius = 19;
  const c = scene.add.container(x, y);
  const gfx = scene.add.graphics();
  const hit = scene.add.rectangle(0, 0, w, h, 0xffffff, 0)
    .setInteractive({ useHandCursor: true });
  const txt = scene.add.text(0, 0, label, {
    fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
    fontSize: '16px', fontStyle: 'bold', color: '#fff',
  }).setOrigin(0.5);
  c.add([gfx, hit, txt]);

  let _hover = false;
  let _selected = selected;
  const draw = () => {
    gfx.clear();
    const base = _selected ? selectedColor : (_hover ? 0x303a4a : 0x1f2632);
    gfx.fillStyle(0x000000, 0.4); gfx.fillRoundedRect(-w / 2 + 1, -h / 2 + 2, w, h, radius);
    gfx.fillStyle(base, 1);       gfx.fillRoundedRect(-w / 2,     -h / 2,     w, h, radius);
    gfx.lineStyle(2, _selected ? lighten(selectedColor, 0.25) : 0x4a566a, 1);
    gfx.strokeRoundedRect(-w / 2, -h / 2, w, h, radius);
  };
  draw();
  hit.on('pointerover', () => { _hover = true; draw(); });
  hit.on('pointerout',  () => { _hover = false; draw(); });
  hit.on('pointerup',   () => onClick(c));
  c.setSelected = (s) => { _selected = s; draw(); };
  c.isSelected = () => _selected;
  return c;
}

    panel.fillRoundedRect(px + 4, py + 10, pw, ph, 22);
    panel.fillStyle(0x161c2d, 1);
    panel.fillRoundedRect(px, py, pw, ph, 22);
    panel.lineStyle(2, 0x2a3144, 1);
    panel.strokeRoundedRect(px, py, pw, ph, 22);

    panel.fillStyle(0xffd34a, 1);
    panel.fillRect(px + pw / 2 - 50, py, 100, 6);

    const titleY = py + 82;
    const logoG = this.add.graphics().setDepth(2);
    const drawChevron = (cx, cy, dir, alpha) => {
      logoG.fillStyle(0xffd34a, alpha);
      logoG.fillTriangle(cx, cy - 18, cx + dir * 14, cy, cx, cy + 18);
    };
    for (let i = 0; i < 2; i++) {
      drawChevron(W / 2 - 142 - i * 22, titleY,  1, 0.90 - i * 0.30);
      drawChevron(W / 2 + 142 + i * 22, titleY, -1, 0.90 - i * 0.30);
    }
    this.tweens.add({
      targets: logoG,
      alpha: { from: 1, to: 0.6 },
      yoyo: true, repeat: -1, duration: 1100, ease: 'Sine.InOut',
    });

    const title = this.add.text(W / 2, titleY, 'APEX', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '104px', fontStyle: '900',
      color: '#ffffff',
    }).setOrigin(0.5).setDepth(3);
    title.setShadow(0, 4, '#ff5e3a', 22, false, true);

    const stripeG = this.add.graphics().setDepth(3);
    stripeG.fillStyle(0xff5e3a, 1);
    stripeG.fillRect(W / 2 - 80, titleY + 42, 160, 3);
    stripeG.fillStyle(0xffd34a, 1);
    stripeG.fillRect(W / 2 - 24, titleY + 42, 48, 3);

    this.add.text(W / 2, titleY + 64, 'TOP-DOWN ARCADE RACING', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '13px', fontStyle: 'bold',
      color: '#c4cdd9', letterSpacing: '4px',
    }).setOrigin(0.5).setDepth(3);

    // ----- Track preview (slightly tighter so the card breathes) -----
    const previewW = 460, previewH = 220;
    const previewX = W / 2 - previewW / 2;
    const previewY = titleY + 90;

    previewBg.fillRoundedRect(previewX - 6, previewY - 6, previewW + 12, previewH + 12, 12);
    previewBg.lineStyle(2, 0x2a3144, 1);
    previewBg.strokeRoundedRect(previewX - 6, previewY - 6, previewW + 12, previewH + 12, 12);

    this.previewArea = { x: previewX, y: previewY, w: previewW, h: previewH };
    this.previewMarkerProgress = 0;
    this._regenPreview();
    this.time.addEvent({ delay: 6000, loop: true, callback: () => this._regenPreview() });

      this.pills[key] = pill;
    });

    this.lapHint = this.add.text(W / 2, diffY + 36, '', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '12px', fontStyle: 'bold',
      color: '#ffd34a', letterSpacing: '3px',

    // ----- Start button — pushed further down so it doesn't kiss the lap hint -----
    const startBtn = makeButton(this, W / 2, diffY + 92, 260, 58, '🏁  START RACE', {
      fontSize: 22,
      onClick: () => {
        Audio.init();
        this.scene.start('Race', { difficulty: this.savedDifficulty });

    // ----- Theme variety row pulled up so the button isn't orphaned -----
    const themeRowY = py + ph - 78;
    this.add.text(W / 2, themeRowY - 22, 'THEMES — RANDOMIZED PER RACE', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '10px', fontStyle: 'bold',
      color: '#5e6878', letterSpacing: '3px',
    }).setOrigin(0.5).setDepth(3);
    const themeRow = [
      { color: THEMES.forest.bg, name: 'FOREST' },
      { color: THEMES.desert.bg, name: 'DESERT' },
      { color: THEMES.lake.bg,   name: 'LAKE'   },
    ];
    themeRow.forEach((t, i) => {
      const x = W / 2 + (i - 1) * 90;
      const dot = this.add.graphics().setDepth(3);
      dot.fillStyle(0x000000, 0.4);
      dot.fillCircle(x + 1, themeRowY + 2, 10);
      dot.fillStyle(t.color, 1);
      dot.fillCircle(x, themeRowY, 9);
      dot.lineStyle(2, 0x39425b, 1);
      dot.strokeCircle(x, themeRowY, 9);
      this.add.text(x, themeRowY + 22, t.name, {
        fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
        fontSize: '10px', fontStyle: 'bold',
        color: '#9aa6b8', letterSpacing: '2px',
      }).setOrigin(0.5).setDepth(3);
    });

    // ----- Controls hint outside the panel -----
    const controlsY = Math.min(py + ph + 28, H - 30);
    this.add.text(W / 2, controlsY, 'WASD / Arrows — drive   ·   Space — restart   ·   R — new track', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '12px', color: '#7d8aa0',
    }).setOrigin(0.5);
    this.add.text(W / 2, controlsY + 18, 'P — pause   ·   M — mute   ·   Esc — menu   ·   Enter — start', {
      fontFamily: 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
      fontSize: '12px', color: '#7d8aa0',
    }).setOrigin(0.5);

    // Keyboard
    this.input.keyboard.on('keydown-ENTER', () => {
      Audio.init();
      this.scene.start('Race', { difficulty: this.savedDifficulty });
    });
    this.input.keyboard.on('keydown-M', () => Audio.toggleMute());
  }

  _selectDifficulty(key) {
    this.savedDifficulty = key;
    Object.entries(this.pills).forEach(([k, pill]) => pill.setSelected(k === key));
    this._updateLapHint();
  }

  _updateLapHint() {
    if (!this.lapHint) return;
    const laps = DIFFICULTY[this.savedDifficulty].laps;
    this.lapHint.setText(`${laps} LAP${laps === 1 ? '' : 'S'}`);
  }

  _regenPreview() {
    const track = generateTrack();
    this.previewSamples = track.samples;
    this.previewMarkerProgress = 0;
    this._renderPreview();
  }

  _renderPreview() {
    const { x, y, w, h } = this.previewArea;
    const g = this.previewGfx;
    g.clear();

    // Frame
    g.fillStyle(0x0f1320, 1);
    g.fillRoundedRect(x, y, w, h, 10);

    if (!this.previewSamples) return;

    // Find world bbox
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of this.previewSamples) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const scale = Math.min((w - 40) / (maxX - minX), (h - 40) / (maxY - minY));
    const ox = x + (w - (maxX - minX) * scale) / 2 - minX * scale;
    const oy = y + (h - (maxY - minY) * scale) / 2 - minY * scale;

    // Outline thick (road)
    g.lineStyle(14 * scale + 6, 0x2a3144, 1);
    g.beginPath();
    for (let i = 0; i <= this.previewSamples.length; i++) {
      const p = this.previewSamples[i % this.previewSamples.length];
      const sx = ox + p.x * scale, sy = oy + p.y * scale;
      if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy);
    }
    g.strokePath();

    g.lineStyle(10 * scale + 2, 0x4a566a, 1);
    g.beginPath();
    for (let i = 0; i <= this.previewSamples.length; i++) {
      const p = this.previewSamples[i % this.previewSamples.length];
      const sx = ox + p.x * scale, sy = oy + p.y * scale;
      if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy);
    }
    g.strokePath();

    // Center dashes
    g.lineStyle(1.5, 0xffd34a, 0.8);
    for (let i = 0; i < this.previewSamples.length; i += 4) {
      const a = this.previewSamples[i];
      const b = this.previewSamples[(i + 2) % this.previewSamples.length];
      g.beginPath();
      g.moveTo(ox + a.x * scale, oy + a.y * scale);
      g.lineTo(ox + b.x * scale, oy + b.y * scale);
      g.strokePath();
    }

    this.previewProj = { ox, oy, scale };
  }

  update(_, delta) {
    const dt = delta / 1000;

    // Animate background speed lines — drift down-right and wrap.
    if (this.speedLinesGfx && this._speedLineData) {
      const W = this.scale.width, H = this.scale.height;
      this.speedLinesGfx.clear();
      for (const d of this._speedLineData) {
        d.x += d.speed * dt;
        d.y += d.speed * 0.45 * dt;
        if (d.x > W + 200) { d.x = -200; d.y = Math.random() * (H + 200) - 100; }
        if (d.y > H + 200) { d.y = -200; }
        this.speedLinesGfx.lineStyle(2, 0xff8a5a, d.alpha);
        this.speedLinesGfx.beginPath();
        this.speedLinesGfx.moveTo(d.x, d.y);
        this.speedLinesGfx.lineTo(d.x + d.len, d.y + d.len * 0.45);
        this.speedLinesGfx.strokePath();
      }
    }

    if (!this.previewSamples) return;
    // Advance marker
    this.previewMarkerProgress += dt * 0.18;
    if (this.previewMarkerProgress >= 1) this.previewMarkerProgress -= 1;

    // Re-render preview each frame is overkill; use a marker overlay
    if (!this.markerGfx) this.markerGfx = this.add.graphics();
    this.markerGfx.clear();
    if (!this.previewProj) return;
    const { ox, oy, scale } = this.previewProj;
    const idx = Math.floor(this.previewMarkerProgress * this.previewSamples.length) % this.previewSamples.length;
    const p = this.previewSamples[idx];
    const mx = ox + p.x * scale, my = oy + p.y * scale;
    this.markerGfx.fillStyle(0xffffff, 0.35);
    this.markerGfx.fillCircle(mx, my, 8);
    this.markerGfx.fillStyle(0xff5e3a, 1);
    this.markerGfx.fillCircle(mx, my, 4);
  }
}

/* =====================================================================
   CAR — physics state holder
   ===================================================================== */
class Car {
  constructor(x, y, heading, color, isPlayer, personality, label) {
    this.x = x; this.y = y; this.heading = heading;
    this.vx = 0; this.vy = 0;
    this.color = color;
    this.isPlayer = !!isPlayer;
    this.personality = personality || null;
    this.label = label || (isPlayer ? 'YOU' : 'AI');
    // -1 so the first start-line crossing advances to 0 = "racing lap 1".
    // Cars spawn behind the line and we don't want that initial cross to
    // count as a completed lap.
    this.lap = -1;
    this.lastS = 0;
    this.s = 0;
    this.boostTimer = 0;
    this.oilTimer = 0;
    this.offTrack = false;
    this.sprite = null;
    this.brake = null;
    this.headlight = null;
    this.lapTimes = [];
    this.lapStartTime = 0;
    this.bestLap = null;
    this.finishedTime = null;     // ms when crossed finish on final lap
    this.finishedRank = null;     // assigned at race end
    this.totalProgress = 0;       // lap*totalLen + s, for ranking
    this.lastSkidT = 0;
    this.damage = 0;              // 0..0.65, accumulates from heavy hits
  }
  get speed() { return Math.hypot(this.vx, this.vy); }
}

/* =====================================================================
   RACE SCENE — the main game
   ===================================================================== */
class RaceScene extends Phaser.Scene {
  constructor() { super('Race'); }

  init(data) {
    this.difficulty = (data && data.difficulty) || 'normal';
    this.preferKeepTrack = (data && data.keepTrack) || false;
    this.preservedTrackData = (data && data.preservedTrackData) || null;
    this.preservedTheme = (data && data.preservedTheme) || null;
  }

  create() {
    this.state = 'COUNTDOWN';
    this.elapsed = 0;
    this.countdownT = 3.0;     // shows 3 → 2 → 1 → GO
    this.lastBeep = 99;        // sentinel — guarantees the first beep fires
    this.totalLaps = DIFFICULTY[this.difficulty].laps;
    this.paused = false;
    this.endShown = false;

    // ---- Theme + track ----
    if (this.preferKeepTrack && this.preservedTrackData && this.preservedTheme) {
      this.trackData = this.preservedTrackData;
      this.theme = this.preservedTheme;
    } else {
      this.trackData = generateTrack();
      const themeKeys = Object.keys(THEMES);
      this.theme = THEMES[themeKeys[Math.floor(Math.random() * themeKeys.length)]];
      this._populateTrackExtras();
    }
    this.samples = this.trackData.samples;

    // ---- World setup ----
    this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
    this.physics = null; // we run our own physics
    this._renderGround();
    this._renderRoad();
    this._renderCurbs();
    this._renderBoosts();
    this._renderOils();
    this._renderDecorations();
    this._renderFurniture();
    this._renderStartLine();
    this._renderAmbience();

    // Skid mark layer (under cars)
    this.skidLayer = this.add.layer();
    this.skidLayer.setDepth(2);

    // ---- Cars ----
    this._spawnCars();

    // ---- Camera ----
    this.cameras.main.startFollow(this.player.sprite, true, 0.15, 0.15);
    this.cameras.main.setZoom(1);

    // ---- HUD ----
    this._buildHud();

    // ---- Mini-map ----
    this._buildMinimap();

    // ---- Input ----
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D,P,R,SPACE,ESC,M,ENTER');
    this.input.keyboard.on('keydown-P', () => this._togglePause());
    this.input.keyboard.on('keydown-M', () => Audio.toggleMute());
    this.input.keyboard.on('keydown-R', () => this._restart(false));
    this.input.keyboard.on('keydown-SPACE', () => this._restart(true));
    this.input.keyboard.on('keydown-ESC', () => this._toMenu());
    if (DEBUG) {
      this.input.keyboard.on('keydown-G', () => this._debugForceEnd(true));
      this.input.keyboard.on('keydown-H', () => this._debugForceEnd(false));
    }

    // ---- Audio ----
    Audio.init();
    Audio.startEngine();
    Audio.startSkid();
    Audio.startGrass();
    Audio.startCrowd();
    Audio.updateEngine(0);

    // ---- Countdown UI ----
    this._buildCountdown();

    // Cleanup audio when scene shuts down
    this.events.on('shutdown', () => {
      Audio.silenceEngine();
      Audio.silenceLoops();
    });
  }

  _populateTrackExtras() {
    // Use trackData.samples directly — this.samples isn't assigned until
    // after this returns (and we want to keep that order for clarity).
    const s = this.trackData.samples;
    this.trackData.boosts = placePads(s, 3, BOOST_LEN, 'low');
    this.trackData.oils   = placePads(s, 2, OIL_LEN,  'high');
    this.trackData.decos  = placeDecorations(
      s,
      this.theme.decoCount,
      this.theme.decoKeys,
      this.theme.decoScaleMin,
      this.theme.decoScaleMax
    );
    // Track furniture
    const padPositions = [...this.trackData.boosts, ...this.trackData.oils];
    this.trackData.tribunes   = pickStraights(s, 2, padPositions, 260)
      .map(t => ({ ...t, side: Math.random() > 0.5 ? 1 : -1 }));
    this.trackData.tireStacks = pickApexes(s, 3);
    this.trackData.cones      = placeCones(s);
    if (this.theme.animalKeys) {
      this.trackData.animals = placeDecorations(
        s,
        this.theme.animalCount,
        this.theme.animalKeys,
        this.theme.animalScaleMin,
        this.theme.animalScaleMax
      );
    }
  }

  /* ----------------- WORLD RENDERING ----------------- */
  _renderGround() {
    const g = this.add.graphics();
    g.fillStyle(this.theme.bg, 1);
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    // Background accent — soft mottling for visual depth
    for (let i = 0; i < 240; i++) {
      const x = Math.random() * WORLD_W;
      const y = Math.random() * WORLD_H;
      const r = 40 + Math.random() * 100;
      g.fillStyle(this.theme.bgAccent, 0.05 + Math.random() * 0.06);
      g.fillCircle(x, y, r);
    }

    // Theme-specific texture overlay
    const name = this.theme.name;
    if (name === 'Desert') {
      // Sand dune ridges — long shallow horizontal arcs
      for (let i = 0; i < 55; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        const len = 140 + Math.random() * 240;
        const drop = (Math.random() - 0.5) * 14;
        g.lineStyle(2, 0x8a6a4a, 0.20 + Math.random() * 0.20);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + len * 0.5, y + drop * 0.6);
        g.lineTo(x + len, y);
        g.strokePath();
      }
      // Sparse highlight ridges — lighter sand on top of dunes
      for (let i = 0; i < 35; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        const len = 80 + Math.random() * 130;
        g.lineStyle(1.5, 0xe8d4ad, 0.18 + Math.random() * 0.15);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + len, y - 2);
        g.strokePath();
      }
    } else if (name === 'Lake') {
      // Water ripples — small flattened ellipses scattered
      for (let i = 0; i < 110; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        const r = 8 + Math.random() * 16;
        g.lineStyle(1.5, 0x4a8fc4, 0.20 + Math.random() * 0.15);
        g.strokeEllipse(x, y, r * 2.4, r * 0.8);
      }
      // A few lighter highlight bands for sun glints on the water
      for (let i = 0; i < 30; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        const w = 50 + Math.random() * 90;
        g.lineStyle(2, 0xb8e0f0, 0.10 + Math.random() * 0.10);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + w, y);
        g.strokePath();
      }
    } else if (name === 'Forest') {
      // Lighter grass clearings — adds open glades between dense woods
      for (let i = 0; i < 45; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        const r = 70 + Math.random() * 110;
        g.fillStyle(0x4a7d4a, 0.10 + Math.random() * 0.10);
        g.fillCircle(x, y, r);
      }
      // Tiny dark dots for grass blade hints
      for (let i = 0; i < 200; i++) {
        const x = Math.random() * WORLD_W;
        const y = Math.random() * WORLD_H;
        g.fillStyle(0x1f3d22, 0.35);
        g.fillRect(x, y, 1.5, 3);
      }
    }

    g.setDepth(0);
  }

  _renderRoad() {
    const samples = this.samples;
    const g = this.add.graphics();
    g.setDepth(1);

    // Road shadow halo — three stacked bands give a soft fall-off into a
    // sharp dark line at the asphalt edge. Each band gets fully painted,
    // including the area inside it; the road quad below covers the centre.
    const halos = [
      { width: 26, alpha: 0.10 },   // wide outer falloff
      { width: 14, alpha: 0.20 },   // mid band
      { width: 4,  alpha: 0.40 },   // sharp edge line
    ];
    for (const h of halos) {
      g.fillStyle(0x000000, h.alpha);
      for (let i = 0; i < samples.length; i++) {
        const a = samples[i], b = samples[(i + 1) % samples.length];
        const offset = ROAD_HALF + h.width;
        g.fillPoints([
          { x: a.x + a.nx * offset, y: a.y + a.ny * offset },
          { x: b.x + b.nx * offset, y: b.y + b.ny * offset },
          { x: b.x - b.nx * offset, y: b.y - b.ny * offset },
          { x: a.x - a.nx * offset, y: a.y - a.ny * offset },
        ], true);
      }
    }

    // Asphalt: alternating shades for joint look
    for (let i = 0; i < samples.length; i++) {
      const a = samples[i], b = samples[(i + 1) % samples.length];
      const c = (i % 2 === 0) ? 0x2c2c30 : 0x32323a;
      g.fillStyle(c, 1);
      g.fillPoints([
        { x: a.x + a.nx * ROAD_HALF, y: a.y + a.ny * ROAD_HALF },
        { x: b.x + b.nx * ROAD_HALF, y: b.y + b.ny * ROAD_HALF },
        { x: b.x - b.nx * ROAD_HALF, y: b.y - b.ny * ROAD_HALF },
        { x: a.x - a.nx * ROAD_HALF, y: a.y - a.ny * ROAD_HALF },
      ], true);
    }

    // Center dashes
    g.fillStyle(0xf1d24a, 0.7);
    for (let i = 0; i < samples.length; i += 6) {
      const a = samples[i];
      const b = samples[Math.min(samples.length - 1, i + 2)];
      g.fillPoints([
        { x: a.x + a.nx * 1.2, y: a.y + a.ny * 1.2 },
        { x: b.x + b.nx * 1.2, y: b.y + b.ny * 1.2 },
        { x: b.x - b.nx * 1.2, y: b.y - b.ny * 1.2 },
        { x: a.x - a.nx * 1.2, y: a.y - a.ny * 1.2 },
      ], true);
    }

    // Asphalt speckle dots — light pepper for texture
    for (let k = 0; k < 600; k++) {
      const idx = Math.floor(Math.random() * samples.length);
      const a = samples[idx];
      const t = (Math.random() - 0.5) * 2;
      const x = a.x + a.nx * (ROAD_HALF * 0.95) * t;
      const y = a.y + a.ny * (ROAD_HALF * 0.95) * t;
      const dot = this.add.image(x, y, 'asphaltDot').setDepth(1).setAlpha(0.5);
      dot.setScale(0.6 + Math.random() * 0.6);
    }
  }

  _renderCurbs() {
    const samples = this.samples;
    const g = this.add.graphics();
    g.setDepth(1.5);
    const curbWidth = 9;

    // Identify high-curvature stretches; draw alternating curb on inside.
    const threshold = 0.0035; // tuned: above this, draw curb
    let runColor = 0;
    for (let i = 0; i < samples.length; i++) {
      const a = samples[i], b = samples[(i + 1) % samples.length];
      const c = a.curv || 0;
      const ac = Math.abs(c);
      if (ac < threshold) continue;
      const side = c > 0 ? 1 : -1; // inside of corner
      const intensity = Math.min(1, ac / 0.012);
      runColor++;
      const color = (runColor % 2 === 0) ? this.theme.curbA : this.theme.curbB;
      const r1 = ROAD_HALF;
      const r2 = ROAD_HALF - curbWidth - intensity * 4;
      g.fillStyle(color, 0.95);
      g.fillPoints([
        { x: a.x + side * a.nx * r1, y: a.y + side * a.ny * r1 },
        { x: b.x + side * b.nx * r1, y: b.y + side * b.ny * r1 },
        { x: b.x + side * b.nx * r2, y: b.y + side * b.ny * r2 },
        { x: a.x + side * a.nx * r2, y: a.y + side * a.ny * r2 },
      ], true);
    }
  }

  _renderBoosts() {
    // Three chevrons in a row along the road tangent, scaled smaller, each
    // pulsing on a staggered delay so the row reads as "go-go-go".
    // Kenney arrow_yellow tip points NORTH in the bitmap → +π/2 to align.
    const ARROW_ROT = Math.PI / 2;
    const ARROW_SCALE = 0.28;
    const ARROW_SPACING = 44; // along road tangent — wide enough to read as 3 chevrons
    const COUNT = 3;
    for (const boost of this.trackData.boosts) {
      const p = boost.p;
      const ang = Math.atan2(p.ty, p.tx);
      const fx = Math.cos(ang), fy = Math.sin(ang);
      const sprites = [];
      for (let k = 0; k < COUNT; k++) {
        // Center the row of arrows on the boost point.
        const along = (k - (COUNT - 1) / 2) * ARROW_SPACING;
        const ax = p.x + fx * along;
        const ay = p.y + fy * along;
        const img = this.add.image(ax, ay, 'arrow_yellow')
          .setRotation(ang + ARROW_ROT)
          .setScale(ARROW_SCALE)
          .setDepth(1.7);
        sprites.push(img);
      }
      // Sequential pulse — back of the chevron firing first creates a
      // forward-moving shimmer.
      sprites.forEach((img, idx) => {
        this.tweens.add({
          targets: img,
          alpha:  { from: 0.55, to: 1.0 },
          scale:  { from: ARROW_SCALE * 0.92, to: ARROW_SCALE * 1.10 },
          yoyo: true, repeat: -1,
          duration: 480, ease: 'Sine.InOut',
          delay: idx * 140,
        });
      });
      boost.sprites = sprites;
    }
  }

  _renderOils() {
    // Oil PNG is 109×95; scale to read as a slick puddle on the road.
    for (const oil of this.trackData.oils) {
      const p = oil.p;
      const ang = Math.atan2(p.ty, p.tx);
      const img = this.add.image(p.x, p.y, 'oil')
        .setRotation(ang)
        .setScale(1.05)
        .setDepth(1.7);
      oil.sprite = img;
    }
  }

  _renderDecorations() {
    const tint = this.theme.decoTint;
    for (const d of this.trackData.decos) {
      const img = this.add.image(d.x, d.y, d.key)
        .setRotation(d.rot)
        .setScale(d.scale)
        .setDepth(0.5);
      if (tint) img.setTint(tint);
      img._isDeco = true;
    }
    if (this.trackData.animals) {
      for (const a of this.trackData.animals) {
        // Animals don't rotate — they always face forward (top of sprite up).
        const img = this.add.image(a.x, a.y, a.key)
          .setScale(a.scale)
          .setDepth(0.55);
        // Subtle breathing / idle bob — each gets its own period & phase so
        // the field doesn't pulse in sync.
        this.tweens.add({
          targets: img,
          scaleY: a.scale * 1.08,
          yoyo: true, repeat: -1,
          duration: 900 + Math.random() * 600,
          delay: Math.random() * 1200,
          ease: 'Sine.InOut',
        });
      }
    }
  }

  _renderFurniture() {
    // ----- Tribunes: outside the road on the +/- normal side, parallel to tangent.
    const tribuneOffset = ROAD_HALF + 130; // push past the curb + a bit of breathing room
    for (const t of this.trackData.tribunes) {
      const p = t.p;
      const ang = Math.atan2(p.ty, p.tx);
      const tx = p.x + t.side * p.nx * tribuneOffset;
      const ty = p.y + t.side * p.ny * tribuneOffset;
      const key = Math.random() > 0.25 ? 'tribune_full' : 'tribune_empty';
      const img = this.add.image(tx, ty, key)
        .setRotation(ang)
        .setScale(0.42)
        .setDepth(0.55);
      // Soft drop shadow under the grandstand
      const shadow = this.add.image(tx + 6, ty + 8, key)
        .setRotation(ang).setScale(0.42).setDepth(0.54)
        .setTint(0x000000).setAlpha(0.35);
      // Cache center for proximity audio
      t.x = tx; t.y = ty;
    }

    // ----- Tire stacks at corner apexes, on the OUTSIDE of each apex (runoff side).
    for (const ts of this.trackData.tireStacks) {
      const p = ts.p;
      // outside = opposite side of the curve direction
      const side = (p.curv || 0) > 0 ? -1 : 1;
      const offset = ROAD_HALF + 22;
      const cx = p.x + side * p.nx * offset;
      const cy = p.y + side * p.ny * offset;
      const ang = Math.atan2(p.ty, p.tx);
      const fx = Math.cos(ang), fy = Math.sin(ang);
      const lx = -fy, ly = fx;
      // Three tires in a small triangle, alternating colors
      const layout = [
        { f: -10, l: 0,  k: 'tires_red'   },
        { f:  10, l: 0,  k: 'tires_white' },
        { f:   0, l: 12, k: 'tires_red'   },
      ];
      for (const tile of layout) {
        const wx = cx + fx * tile.f + lx * tile.l * side;
        const wy = cy + fy * tile.f + ly * tile.l * side;
        this.add.image(wx, wy, tile.k)
          .setScale(0.45)
          .setDepth(1.55);
      }
    }

    // ----- Cones along the inside curb of every tight corner.
    const coneOffset = ROAD_HALF + 8;
    for (const c of this.trackData.cones) {
      const p = c.p;
      const cx = p.x + c.side * p.nx * coneOffset;
      const cy = p.y + c.side * p.ny * coneOffset;
      this.add.image(cx, cy, 'cone')
        .setScale(0.42)
        .setDepth(1.55);
    }

    // ----- Race barriers flanking the start line on both sides.
    const start = this.samples[0];
    const startAng = Math.atan2(start.ty, start.tx);
    const fx = Math.cos(startAng), fy = Math.sin(startAng);
    const barrierOffset = ROAD_HALF + 28;
    for (let i = -1; i <= 1; i++) {
      const along = i * 70;
      for (const side of [-1, 1]) {
        const bx = start.x + fx * along + side * start.nx * barrierOffset;
        const by = start.y + fy * along + side * start.ny * barrierOffset;
        const key = (i + side) % 2 === 0 ? 'barrier_race_red' : 'barrier_race_white';
        this.add.image(bx, by, key)
          .setRotation(startAng)
          .setScale(0.6)
          .setDepth(1.55);
      }
    }
  }

  _renderAmbience() {
    const a = this.theme.ambience;
    if (!a) return;
    const cfg = {
      x: { min: 0, max: WORLD_W },
      y: { min: 0, max: WORLD_H },
      lifespan: a.lifespan,
      frequency: a.frequency,
      quantity: 1,
      tint: a.tint,
    };
    if (a.speedX) cfg.speedX = a.speedX;
    if (a.speedY) cfg.speedY = a.speedY;
    if (a.scale)  cfg.scale  = a.scale;
    if (a.alpha)  cfg.alpha  = a.alpha;
    if (a.rotate) cfg.rotate = a.rotate;
    if (a.blendMode) cfg.blendMode = a.blendMode;
    const emitter = this.add.particles(0, 0, a.key, cfg);
    emitter.setDepth(4); // above cars so leaves/sparkles drift over the action
  }

  _renderStartLine() {
    // Use index 0 of centerline as start/finish
    const a = this.samples[0];
    const ang = Math.atan2(a.ty, a.tx);
    const g = this.add.graphics();
    g.setDepth(1.6);
    const sw = 14, sh = ROAD_HALF * 2;
    // Checkered pattern: 2 rows of 8 squares
    const cols = 8, rows = 2;
    const cw = sw / rows;
    const ch = sh / cols;
    const ox = -sw / 2, oy = -sh / 2;
    g.translateCanvas(a.x, a.y);
    g.rotateCanvas(ang);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const isW = (r + c) % 2 === 0;
        g.fillStyle(isW ? 0xffffff : 0x111111, 1);
        g.fillRect(ox + r * cw, oy + c * ch, cw, ch);
      }
    }
  }

  /* ----------------- CAR SPAWN ----------------- */
  _spawnCars() {
    const a = this.samples[0];
    const ang = Math.atan2(a.ty, a.tx);
    const fx = Math.cos(ang), fy = Math.sin(ang);
    const lx = -fy, ly = fx;

    // Kenney top-down cars face north (-Y); Phaser angle 0 = +X, so render at heading + π/2.
    const SPRITE_ROT = Math.PI / 2;
    const CAR_SCALE = 0.5;

    const slots = [
      { lateral:  60, back:  60, key: 'car_red',    isPlayer: true,  pers: null,                  label: 'YOU' },
      { lateral: -60, back:  60, key: 'car_blue',   isPlayer: false, pers: AI_PERSONALITIES.aggro,  label: 'AGGRO' },
      { lateral:  60, back: 120, key: 'car_yellow', isPlayer: false, pers: AI_PERSONALITIES.blitz,  label: 'BLITZ' },
      { lateral: -60, back: 120, key: 'car_green',  isPlayer: false, pers: AI_PERSONALITIES.cruise, label: 'CRUISE' },
    ];

    this.cars = [];
    for (const slot of slots) {
      const x = a.x + lx * slot.lateral - fx * slot.back;
      const y = a.y + ly * slot.lateral - fy * slot.back;
      const car = new Car(x, y, ang, slot.key, slot.isPlayer, slot.pers, slot.label);
      car.spriteRotOffset = SPRITE_ROT;

      const sprite = this.add.image(x, y, slot.key)
        .setRotation(ang + SPRITE_ROT)
        .setScale(CAR_SCALE)
        .setDepth(3);
      const brake = this.add.image(0, 0, 'brakeGlow')
        .setVisible(false).setDepth(2.9);
      const head = this.add.image(0, 0, 'headGlow')
        .setVisible(false).setDepth(2.9);
      car.sprite = sprite;
      car.brake = brake;
      car.headlight = head;

      const proj = this._projectS(car.x, car.y);
      car.lastS = proj.s; car.s = proj.s;

      this.cars.push(car);
      if (slot.isPlayer) this.player = car;
    }
  }

  // Half-circle speedometer arc + needle pivoting bottom-center.
  _drawGauge(speed) {
    const g = this.gaugeGfx;
    const { x: cx, y: cy, r: R } = this.gaugeCenter;
    g.clear();

    // Background arc (top half)
    const N = 28;
    g.lineStyle(7, 0x232a3a, 1);
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = Math.PI + (i / N) * Math.PI;
      const x = cx + Math.cos(t) * R;
      const y = cy + Math.sin(t) * R;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.strokePath();

    // Colored fill arc proportional to speed
    const ratio = Math.max(0, Math.min(1, speed / MAX_SPEED));
    const color = ratio < 0.55 ? 0x2ecc71 : (ratio < 0.85 ? 0xf1c40f : 0xe74c3c);
    if (ratio > 0.02) {
      g.lineStyle(7, color, 1);
      g.beginPath();
      const M = Math.max(2, Math.floor(N * ratio));
      for (let i = 0; i <= M; i++) {
        const t = Math.PI + (i / N) * Math.PI;
        const x = cx + Math.cos(t) * R;
        const y = cy + Math.sin(t) * R;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.strokePath();
    }

    // Tick marks every 25%
    for (let i = 0; i <= 4; i++) {
      const t = Math.PI + (i / 4) * Math.PI;
      const r1 = R - 6, r2 = R + 4;
      g.lineStyle(2, 0x4a566a, 0.75);
      g.beginPath();
      g.moveTo(cx + Math.cos(t) * r1, cy + Math.sin(t) * r1);
      g.lineTo(cx + Math.cos(t) * r2, cy + Math.sin(t) * r2);
      g.strokePath();
    }

    // Needle
    const needleT = Math.PI + ratio * Math.PI;
    const needleLen = R - 6;
    g.lineStyle(3, 0xffffff, 1);
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(needleT) * needleLen, cy + Math.sin(needleT) * needleLen);
    g.strokePath();

    // Hub
    g.fillStyle(0x1a1f2c, 1); g.fillCircle(cx, cy, 6);
    g.fillStyle(0xe74c3c, 1); g.fillCircle(cx, cy, 3);
  }

  /* ----------------- MINIMAP ----------------- */
  _buildMinimap() {
    const W = this.scale.width, H = this.scale.height;
    const mw = 220, mh = 160;
    const mx = W - mw - 18, my = H - mh - 18;

    this.miniArea = { x: mx, y: my, w: mw, h: mh };

    // Frame
    this.miniGfxBg = this.add.graphics().setScrollFactor(0).setDepth(99);
    this.miniGfxBg.fillStyle(0x000000, 0.55);
    this.miniGfxBg.fillRoundedRect(mx, my, mw, mh, 10);
    this.miniGfxBg.lineStyle(2, 0x2a3144, 1);
    this.miniGfxBg.strokeRoundedRect(mx, my, mw, mh, 10);

    // Pre-render the static track outline
    this.miniGfxStatic = this.add.graphics().setScrollFactor(0).setDepth(100);

    // Bbox of track
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of this.samples) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const pad = 16;
    const sx = (mw - pad * 2) / (maxX - minX);
    const sy = (mh - pad * 2) / (maxY - minY);
    const scale = Math.min(sx, sy);
    const ox = mx + (mw - (maxX - minX) * scale) / 2 - minX * scale;
    const oy = my + (mh - (maxY - minY) * scale) / 2 - minY * scale;
    this.miniProj = { ox, oy, scale };

    // Outline the road
    this.miniGfxStatic.lineStyle(8, 0x4a566a, 1);
    this.miniGfxStatic.beginPath();
    for (let i = 0; i <= this.samples.length; i++) {
      const p = this.samples[i % this.samples.length];
      const px = ox + p.x * scale, py = oy + p.y * scale;
      if (i === 0) this.miniGfxStatic.moveTo(px, py);
      else this.miniGfxStatic.lineTo(px, py);
    }
    this.miniGfxStatic.strokePath();

    // Boost dots
    for (const b of this.trackData.boosts) {
      this.miniGfxStatic.fillStyle(0xffd000, 1);
      this.miniGfxStatic.fillCircle(ox + b.p.x * scale, oy + b.p.y * scale, 3);
    }

    // Start dot
    const a = this.samples[0];
    this.miniGfxStatic.fillStyle(0xffffff, 1);
    this.miniGfxStatic.fillCircle(ox + a.x * scale, oy + a.y * scale, 3);

    // Dynamic layer for car dots
    this.miniGfxDynamic = this.add.graphics().setScrollFactor(0).setDepth(101);
  }

  /* ----------------- INPUT ----------------- */
  _readPlayerInput() {
    const up    = this.cursors.up.isDown   || this.keys.W.isDown;
    const down  = this.cursors.down.isDown || this.keys.S.isDown;
    const left  = this.cursors.left.isDown || this.keys.A.isDown;
    const right = this.cursors.right.isDown|| this.keys.D.isDown;
    return { throttle: up ? 1 : 0, brake: down ? 1 : 0, steer: (right ? 1 : 0) - (left ? 1 : 0) };
  }

  /* ----------------- PROJECTION ----------------- */
  _projectS(x, y, hint = -1) {
    // Find closest centerline sample to (x,y). Hint = previous index lets us search nearby first.
    const samples = this.samples;
    const N = samples.length;
    let best = 0, bestD = Infinity;
    if (hint >= 0) {
      const span = 25;
      for (let k = -span; k <= span; k++) {
        const i = ((hint + k) % N + N) % N;
        const dx = samples[i].x - x, dy = samples[i].y - y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
    } else {
      for (let i = 0; i < N; i++) {
        const dx = samples[i].x - x, dy = samples[i].y - y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
    }
    const p = samples[best];
    // Lateral offset: dot of (pos-p) on normal
    const dx = x - p.x, dy = y - p.y;
    const lateral = dx * p.nx + dy * p.ny;
    return { idx: best, s: p.s, lateral, dist: Math.sqrt(bestD) };
  }

  /* ----------------- PHYSICS STEP ----------------- */
  _physicsStep(car, throttle, brake, steer, dt, maxSpeedCap) {
    const fx = Math.cos(car.heading), fy = Math.sin(car.heading);
    const lx = -fy, ly = fx;
    let vF = car.vx * fx + car.vy * fy;
    let vL = car.vx * lx + car.vy * ly;

    // Throttle / brake
    if (throttle > 0) vF += ACCEL * throttle * dt;
    if (brake > 0) {
      if (vF > 0) vF -= BRAKE * dt;
      else vF = Math.max(vF - ACCEL * dt, -MAX_REVERSE);
    }
    // Forward friction (always-on slow decay)
    vF *= Math.exp(-FORWARD_FRICTION_K * dt);

    // Speed cap
    const cap = maxSpeedCap || MAX_SPEED;
    if (vF > cap) vF = cap;
    if (vF < -MAX_REVERSE) vF = -MAX_REVERSE;

    // Lateral grip — drift physics
    const speedRatio = Math.min(1, Math.max(0, Math.abs(vF) / MAX_SPEED));
    const grip = GRIP_LOW_SPEED + (GRIP_HIGH_SPEED - GRIP_LOW_SPEED) * speedRatio;
    const oilFactor = car.oilTimer > 0 ? OIL_GRIP_MULT : 1;
    vL *= Math.exp(-grip * oilFactor * dt);

    // Steering — proportional to forward speed (no rotate-in-place)
    const steerRatio = Math.min(1, Math.abs(vF) / 200);
    car.heading += steer * STEER_RATE * steerRatio * dt;
    if (vF < 0) car.heading -= steer * STEER_RATE * steerRatio * dt * 1.1; // counter-steer when reversing

    // Recompose velocity with new heading
    const nfx = Math.cos(car.heading), nfy = Math.sin(car.heading);
    const nlx = -nfy, nly = nfx;
    car.vx = nfx * vF + nlx * vL;
    car.vy = nfy * vF + nly * vL;

    // Integrate
    car.x += car.vx * dt;
    car.y += car.vy * dt;

    // World bounds — bounce softly
    if (car.x < 30)        { car.x = 30;        car.vx = Math.abs(car.vx) * 0.4; }
    if (car.y < 30)        { car.y = 30;        car.vy = Math.abs(car.vy) * 0.4; }
    if (car.x > WORLD_W-30){ car.x = WORLD_W-30;car.vx = -Math.abs(car.vx) * 0.4; }
    if (car.y > WORLD_H-30){ car.y = WORLD_H-30;car.vy = -Math.abs(car.vy) * 0.4; }

    // Track our forward speed for outside callers (skid intensity)
    car._lastVF = vF;
    car._lastVL = vL;
  }

  /* ----------------- AI ----------------- */
  _aiInputs(car) {
    // Find closest centerline (with hint), look ahead 6 + speed/60
    const proj = this._projectS(car.x, car.y, this._aiHint(car));
    car._aiHintIdx = proj.idx;

    const speed = car.speed;
    const lookAhead = Math.floor(6 + speed / 60);
    const N = this.samples.length;
    const targetIdx = (proj.idx + lookAhead) % N;
    const t = this.samples[targetIdx];

    const dx = t.x - car.x, dy = t.y - car.y;
    const desired = Math.atan2(dy, dx);
    let diff = desired - car.heading;
    while (diff >  Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    const steer = Math.max(-1, Math.min(1, diff * 2.4));

    // Avg upcoming curvature
    let totalCurv = 0;
    for (let k = 0; k < lookAhead; k++) {
      totalCurv += Math.abs(this.samples[(proj.idx + k) % N].curv || 0);
    }
    const avgCurv = totalCurv / Math.max(1, lookAhead);

    // The player has no personality — fall back to neutral when this gets
    // called for the player after they finish (post-race coast handling).
    const pers = car.personality || { topSpeed: 1, cornerThrottle: 1 };
    const cornerFloor = DIFFICULTY[this.difficulty].cornerFloor;
    const corner = Math.max(cornerFloor, 1 - avgCurv * 220) * pers.cornerThrottle;
    const throttle = Math.min(1.2, corner);
    const aiCap = MAX_SPEED * pers.topSpeed * DIFFICULTY[this.difficulty].aiTopSpeed;

    return { throttle, brake: 0, steer, cap: aiCap };
  }

  _aiHint(car) {
    return car._aiHintIdx ?? -1;
  }

  /* ----------------- LAP / RANK ----------------- */
  _updateLapAndRank(car, dt) {
    const proj = this._projectS(car.x, car.y, car._lastIdx);
    car._lastIdx = proj.idx;
    const totalLen = this.samples.totalLen;

    // Detect crossing the start/finish: huge negative jump in s (e.g. 8000 -> 80)
    const prevS = car.s;
    const nowS = proj.s;
    if (prevS > totalLen * 0.7 && nowS < totalLen * 0.3) {
      // Forward crossing
      car.lap += 1;
      const lapTime = (this.elapsed - car.lapStartTime);
      // lap >= 1 means we just finished a real lap (lap 0 is the start cross).
      if (car.lap >= 1) {
        car.lapTimes.push(lapTime);
        if (car.bestLap === null || lapTime < car.bestLap) car.bestLap = lapTime;
      }
      car.lapStartTime = this.elapsed;
      if (car.isPlayer && car.lap >= 1 && car.lap <= this.totalLaps) {
        Audio.lapDing();
        Audio.crowdSurge();
      }

      // Final lap completed when lap reaches totalLaps.
      if (car.lap >= this.totalLaps && car.finishedTime === null) {
        car.finishedTime = this.elapsed;
      }
    } else if (prevS < totalLen * 0.3 && nowS > totalLen * 0.7) {
      // Going backward through the line — undo a lap (floor at -1, the start state).
      car.lap = Math.max(-1, car.lap - 1);
    }
    car.s = nowS;
    car.totalProgress = car.lap * totalLen + nowS;

    // Off-track detection
    car.offTrack = Math.abs(proj.lateral) > OFFTRACK_LATERAL_LIMIT;
  }

  _updatePadInteractions(car, dt) {
    const samples = this.samples;
    const totalLen = samples.totalLen;

    // BOOST
    for (const b of this.trackData.boosts) {
      const ds = ((car.s - b.p.s) % totalLen + totalLen) % totalLen;
      const dsNeg = totalLen - ds;
      const along = Math.min(ds, dsNeg);
      if (along < b.len / 2) {
        // Lateral check: must be roughly on-pad
        const proj = this._projectS(car.x, car.y, car._lastIdx);
        if (Math.abs(proj.lateral) < ROAD_HALF * 0.85) {
          if (car.boostTimer <= 0) {
            // Fire boost — kick velocity forward and start timer
            const fx = Math.cos(car.heading), fy = Math.sin(car.heading);
            car.vx += fx * BOOST_KICK;
            car.vy += fy * BOOST_KICK;
            car.boostTimer = BOOST_DURATION;
            if (car.isPlayer) Audio.boost();
            this._spawnBoostParticles(car.x, car.y);
          }
        }
      }
    }

    // OIL
    for (const o of this.trackData.oils) {
      const ds = ((car.s - o.p.s) % totalLen + totalLen) % totalLen;
      const dsNeg = totalLen - ds;
      const along = Math.min(ds, dsNeg);
      if (along < o.len / 2) {
        const proj = this._projectS(car.x, car.y, car._lastIdx);
        if (Math.abs(proj.lateral) < ROAD_HALF * 0.85) {
          car.oilTimer = OIL_DURATION;
        }
      }
    }

    if (car.boostTimer > 0) car.boostTimer -= dt;
    if (car.oilTimer > 0)   car.oilTimer -= dt;
  }

  _spawnBoostParticles(x, y) {

    }).setDepth(4);

    }).setDepth(3.8);
